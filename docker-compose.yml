services:
  postgres:
    image: postgres:16-alpine
    container_name: adlane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adlane
      POSTGRES_PASSWORD: adlane_secret
      POSTGRES_DB: adlane
    ports:
      - "5432:5432"
    volumes:
      - adlane-postgres-data:/var/lib/postgresql/data

volumes:
  adlane-postgres-data:
